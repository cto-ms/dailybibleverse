# GKE CronJob — daily verse-of-the-day upload at 00:05 UTC.
# Uses the same image as the resolver; overrides the command.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verse-of-day-upload
  namespace: truepresence
spec:
  schedule: "5 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: uploader
              image: gcr.io/truepresence/bible-verse:latest
              command: ["node", "src/scripts/06-upload-verse-of-day.mjs"]
              envFrom:
                - secretRef:
                    name: bible-verse-secrets
              env:
                - name: DEFAULT_TRANSLATION
                  value: bsb
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }
